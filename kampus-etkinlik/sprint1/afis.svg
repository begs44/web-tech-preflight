<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kariyer Günleri 2026 etkinlik afişi">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2233"/>
      <stop offset="100%" stop-color="#4d0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- dekoratif geometrik şekiller -->
  <circle cx="700" cy="80" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="60" cy="540" r="160" fill="#ffffff" opacity="0.05"/>
  <path d="M0 430 L800 360 L800 600 L0 600 Z" fill="#000000" opacity="0.12"/>

  <!-- üst etiket -->
  <text x="60" y="90" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#f3c6ca">SEMİNER</text>
  <rect x="60" y="104" width="64" height="4" rx="2" fill="#f3c6ca"/>

  <!-- başlık -->
  <text x="58" y="200" font-family="Trebuchet MS, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Kariyer</text>
  <text x="58" y="270" font-family="Trebuchet MS, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Günleri 2026</text>

  <!-- ikon: el sıkışma / çanta -->
  <g transform="translate(590,150)" opacity="0.95">
    <rect x="0" y="40" width="120" height="80" rx="12" fill="#ffffff" opacity="0.12"/>
    <rect x="20" y="20" width="80" height="30" rx="8" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <rect x="0" y="40" width="120" height="80" rx="12" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <line x1="0" y1="72" x2="120" y2="72" stroke="#ffffff" stroke-width="4" opacity="0.85"/>
    <rect x="50" y="60" width="20" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- alt bilgi çubuğu -->
  <g font-family="Trebuchet MS, Arial, sans-serif" fill="#ffffff">
    <text x="60" y="450" font-size="15" letter-spacing="2" opacity="0.75">TARİH</text>
    <text x="60" y="480" font-size="24" font-weight="700">12 Ekim 2026 · 14:00</text>

    <text x="60" y="530" font-size="15" letter-spacing="2" opacity="0.75">YER</text>
    <text x="60" y="560" font-size="24" font-weight="700">A Blok Konferans Salonu</text>
  </g>

  <line x1="60" y1="410" x2="740" y2="410" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
