<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle · Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2416501083.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>
  <header>
    <p>Kampüs Etkinlikleri</p>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
    </nav>
  </header>

  <main>
    <h1>Etkinlik Ekle</h1>

    <form id="etkinlik-formu" novalidate>
      <div class="alan">
        <label for="ad">Etkinlik Adı</label>
        <input type="text" id="ad" name="ad" autocomplete="off" required aria-describedby="ad-hata">
        <span class="hata" id="ad-hata"></span>
      </div>
      <div class="alan">
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required aria-describedby="kategori-hata">
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
          <option value="Sosyal">Sosyal</option>
        </select>
        <span class="hata" id="kategori-hata"></span>
      </div>
      <div class="alan">
        <label for="tarih">Tarih</label>
        <input type="date" id="tarih" name="tarih" required aria-describedby="tarih-hata">
        <span class="hata" id="tarih-hata"></span>
      </div>
      <div class="alan">
        <label for="saat">Saat</label>
        <input type="time" id="saat" name="saat" required aria-describedby="saat-hata">
        <span class="hata" id="saat-hata"></span>
      </div>
      <div class="alan">
        <label for="yer">Yer</label>
        <input type="text" id="yer" name="yer" autocomplete="off" required aria-describedby="yer-hata">
        <span class="hata" id="yer-hata"></span>
      </div>
      <div class="alan">
        <label for="kontenjan">Kontenjan (isteğe bağlı)</label>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" step="1" inputmode="numeric" aria-describedby="kontenjan-hata">
        <span class="hata" id="kontenjan-hata"></span>
      </div>
      <div class="alan">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="5"></textarea>
      </div>
      <p>
        <button type="submit">Kaydet</button>
      </p>
    </form>
    <div id="form-mesaj" class="form-mesaj" role="status" aria-live="polite"></div>
  </main>

  <footer>
    <p>Bengüsu İlhan · 2416501083 · 2026</p>
  </footer>
</body>
</html>
